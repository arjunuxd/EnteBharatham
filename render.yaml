# EnteBharatham Render blueprint
# Deploys the API service and can be used as a starting point for environments.
# Production must use a managed MongoDB (MongoDB Atlas), a private S3-compatible
# bucket, and an SMTP provider. See docs/DEPLOYMENT.md for setup.

services:
  - type: web
    name: entebharatham-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build -w @entebharatham/shared && npm run build -w @entebharatham/api
    startCommand: npm run start -w @entebharatham/api
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SESSION_MAX_AGE_HOURS
        value: 168
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: false
      - key: SMTP_REQUIRE_TLS
        value: true
      - key: SMTP_REJECT_UNAUTHORIZED
        value: true
      - key: APP_BASE_URL
        sync: false
      - key: RATE_LIMIT_STORE
        value: mongo
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: false
      - key: S3_PREFIX
        value: media/
      - key: MEDIA_SIGNED_URL_TTL_SECONDS
        value: 300
      - key: MEDIA_MAX_SIZE_BYTES
        value: 10485760
      - key: MEDIA_MAX_COUNT_PER_RECORD
        value: 10
    # Run index sync after first deploy/migrations:
    #   npm run db:indexes -w @entebharatham/api
